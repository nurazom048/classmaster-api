  dufs-dev:
    image: sigoden/dufs:latest
    container_name: dufs-dev
    restart: "no"
    ports:
      - "8082:5000"
    volumes:
      - ./classmaster_data_dev:/data
    command: /data -A --auth admin:password123@/:rw
    networks:
      - classmaster-net
  # ৩. MinIO (S3 Object Storage)
