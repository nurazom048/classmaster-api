#    environment:
#      MINIO_ROOT_USER: admin
#      MINIO_ROOT_PASSWORD: password123
#    command: server /data --console-address ":9001"
  api-dev:
    build: .
    container_name: api-dev
    env_file:
      - .env.dev
    ports:
      - "4001:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TZ=Asia/Dhaka
      - DATABASE_URL=postgresql://postgres:1234@db-dev:5432/classmaster_dev?sslmode=disable
    command: sh -c "npx prisma generate --schema=prisma/schema && npx prisma db push --schema=prisma/schema && npm run dev"
    restart: "no"
    depends_on:
      db-dev:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./classmaster_data_dev/backups:/app/backups
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    networks:
      - classmaster-net

volumes:
  pgdata-dev:

networks:
  classmaster-net:
    name: classmaster-net
    external: true
