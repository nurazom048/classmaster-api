services:
  db-dev:
    image: postgres:18-alpine
    container_name: postgres-db-dev
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: classmaster_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - classmaster-net

